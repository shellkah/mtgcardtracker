[project]
name = "mtgcardtracker"
version = "0.2.0"
description = "Local web app that compares Magic: The Gathering card prices across local stores"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi==0.115.*",
    "uvicorn[standard]==0.30.*",
    "httpx==0.27.*",
    "curl_cffi==0.16.*",
    "PyYAML==6.0.*",
]

[dependency-groups]
dev = [
    "pytest==8.*",
]

[tool.uv]
# This is an application, not an installable library: manage the environment
# without building/installing the project itself.
package = false
