services:
  mtgcardtracker:
    image: ghcr.io/shellkah/mtgcardtracker:${MTG_TAG:-latest}
    # build: .            # uncomment to build locally instead of pulling
    container_name: mtgcardtracker
    restart: unless-stopped
    environment:
      MTG_DB_PATH: /data/mtgcardtracker.db
      MTG_CONFIG_PATH: /app/config/stores.yaml
      # Byparr solver on the shared `proxy` network. Run Byparr's own compose
      # (see README) attached to the same network; it resolves as `byparr`.
      MTG_BYPARR_URL: ${MTG_BYPARR_URL:-http://byparr:8191}
      MTG_CART_TTL_DAYS: ${MTG_CART_TTL_DAYS:-30}
    volumes:
      - mtg-data:/data
      # - ./stores.yaml:/app/config/stores.yaml:ro   # custom store config
    expose:
      - "8000"
    networks:
      - proxy

networks:
  proxy:
    external: true
    name: ${PROXY_NETWORK:-proxy}

volumes:
  mtg-data:
